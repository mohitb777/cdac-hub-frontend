<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0914" />
      <stop offset="100%" stop-color="#18132B" />
    </linearGradient>

    <!-- Glowing Purple to Blue Gradient -->
    <linearGradient id="c-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Pink Accent Gradient for Central Node -->
    <linearGradient id="node-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#c-grad)" stroke-width="6" opacity="0.35" />

  <!-- Dotted Network Rays (Connecting the Hub) -->
  <path d="M 210 256 L 340 150" stroke="#F43F5E" stroke-width="16" stroke-linecap="round" opacity="0.7" stroke-dasharray="14 14"/>
  <path d="M 210 256 L 360 330" stroke="#3B82F6" stroke-width="16" stroke-linecap="round" opacity="0.7" stroke-dasharray="14 14"/>

  <!-- Main C-Arc (The C-DAC Arc) -->
  <path d="M 340 150 C 270 90 160 110 120 185 C 80 260 110 355 195 395 C 275 430 350 370 360 330" 
        fill="none" 
        stroke="url(#c-grad)" 
        stroke-width="52" 
        stroke-linecap="round" />

  <!-- Central Hub Nodes -->
  <circle cx="210" cy="256" r="38" fill="url(#node-pink)" />
  <circle cx="210" cy="256" r="18" fill="#FFFFFF" />

  <!-- Connection End Points -->
  <circle cx="340" cy="150" r="28" fill="#A855F7" />
  <circle cx="360" cy="330" r="28" fill="#3B82F6" />
</svg>
